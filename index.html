<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Student Restaurant App</title>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header>
      <h1>Student restaurant app</h1>
      <button type="button" id="settings-button">Settings</button>
      <button type="button" id="login-button">Login</button>
      <label for="theme-toggle">
        <input
          type="checkbox"
          role="switch"
          id="theme-toggle"
          class="visually-hidden"
        />
        <span class="mode-switch"></span>
        <span class="visually-hidden">Lightmode</span>
      </label>
    </header>
    <main>
      <h2 id="filter-header">Filters</h2>
      <div class="filters">
        <div class="filter-group">
          <label for="sort-select">Sort:</label>
          <select id="sort-select">
            <option value="name-asc">Name (A-Z)</option>
            <option value="distance">Nearest</option>
          </select>
        </div>
        <form id="city-form" class="filter-group">
          <label for="city-filter" id="city-label">City: </label>
          <select id="city-filter" name="city">
            <option value="">All Cities</option>
          </select>
        </form>
        <form id="company-form">
          <label for="company-filter" id="company-label">Company: </label>
          <select id="company-filter" name="company" autocomplete="off">
            <option value="">All Companies</option>
            <option value="Sodexo">Sodexo</option>
            <option value="Compass Group">Compass Group</option>
          </select>
        </form>
      </div>
      <p id="location-status" role="status"></p>
      <section id="restaurants">
        <h2 id="main-h2">Restaurants</h2>
        <ul id="restaurant-list"></ul>
      </section>
    </main>
    <footer id="footer">
      <p>Restaurant data: Metropolia Student Restaurants API</p>
      <p>Jonatan Åberg, 10/2026</p>
    </footer>
    <dialog id="settings-dialog" class="dialog">
      <h2>Settings</h2>
      <form method="dialog">
        <fieldset id="language-fieldset">
          <legend>Language</legend>
          <label>
            <input
              type="radio"
              value="fi"
              name="language"
              class="visually-hidden"
              checked
            />
            <span>
              <img src="img/flag-fi.svg" alt="" />
              FI
            </span>
          </label>
          <label>
            <input
              type="radio"
              value="en"
              name="language"
              class="visually-hidden"
            />
            <span>
              <img src="img/flag-gb.svg" alt="" />
              EN
            </span>
          </label>
        </fieldset>
        <button id="settings-close-btn" type="submit">Close</button>
      </form>
    </dialog>
    <dialog id="login-dialog" class="dialog">
      <h2>Login</h2>
      <form id="login-form">
        <label for="login-username">Username</label>
        <input
          type="text"
          id="login-username"
          name="username"
          autocomplete="username"
          required
        />
        <label for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          name="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Log In</button>
      </form>
      <p id="login-error" role="alert" hidden></p>
      <p id ="register-prompt"> 
        No account?
        <button type="button" id="show-register-button">Register</button>
      </p>
      <form id="register-form" hidden>
        <label for="register-username">Username</label>
        <input
          type="text"
          id="register-username"
          name="username"
          autocomplete="username"
          required
        />
        <p id="username-status" aria-live="polite"></p>

        <label for="register-email">Email</label>
        <input
          type="email"
          id="register-email"
          name="email"
          autocomplete="email"
          required
        />

        <label for="register-password">Password</label>
        <input
          type="password"
          id="register-password"
          name="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <p id="register-error" role="alert" hidden></p>

        <button type="submit">Create account</button>
      </form>

      <form method="dialog">
        <button type="submit">Close</button>
      </form>
    </dialog>
    <dialog id="profile-dialog" class="dialog">
      <h2>Profile</h2>
      <img
        id="profile-avatar"
        src="img/default-profile-icon.jpg"
        alt="Profile avatar"
      />
      <form id="profile-avatar-form">
        <label for="profile-avatar-input">Change avatar:</label>
        <input
          type="file"
          id="profile-avatar-input"
          name="avatar"
          accept="image/*"
        />
        <button type="submit">Upload</button>
      </form>
      <form id="profile-form">
        <label for="profile-username-input">Change username</label>
        <input
          type="text"
          id="profile-username-input"
          name="username"
          autocomplete="username"
          required
        />
        <label for="profile-email-input">Change email</label>
        <input
          type="email"
          id="profile-email-input"
          name="email"
          autocomplete="email"
          required
        />
        <label for="profile-password-input">New password</label>
        <input
          type="password"
          id="profile-password-input"
          name="password"
          autocomplete="new-password"
        />
        <button type="submit">Update profile</button>
      </form>
      <button type="button" id="logout-button">Logout</button>
      <form method="dialog">
        <button type="submit">Close</button>
      </form>
    </dialog>
    <dialog id="restaurant-details" class="dialog restaurant-dialog">
      <header>
        <button type="button" id="favorite-button">Add to favorites</button>
        <h2 id="restaurant-name"></h2>
        <p id="restaurant-company"></p>
        <form method="dialog">
          <button type="submit" id="close-details-button">Close</button>
        </form>
      </header>
      <p id="restaurant-address"></p>
      <p id="restaurant-city"></p>
      <div id="restaurant-map"></div>
      <fieldset id="menu-type-fieldset">
        <legend>Menu</legend>
        <label>
          <input type="radio" name="menu-type" value="daily" checked />
          Today
        </label>
        <label>
          <input type="radio" name="menu-type" value="weekly" /> Weekly
        </label>
      </fieldset>
      <p id="menu-status" role="status"></p>
      <div id="restaurant-menu"></div>
    </dialog>
    <dialog
      id="error-dialog"
      class="dialog"
      role="alertdialog"
      aria-labelledby="error-title"
    >
      <h2 id="error-title">API Connection problem</h2>
      <p id="error-message" role="alert">Restaurants could not be loaded.</p>
      <button type="button" id="retry-button">Try again</button>
      <form method="dialog">
        <button type="submit">Close</button>
      </form>
    </dialog>
  </body>
</html>
