<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Student Restaurant App</title>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header>
      <h1>Student restaurant app</h1>
      <button id="settings">Settings</button>
      <button id="login">Login</button>
      <label for="theme-toggle">
        <input
          type="checkbox"
          role="switch"
          id="theme-toggle"
          class="visually-hidden"
        />
        <span class="mode-switch"></span>
        <span class="visually-hidden">Lightmode</span>
      </label>
    </header>
    <main>
      <section id="restaurants">
        <h2>Restaurants</h2>
        <form id="city-form">
          <label for="city-filter">City: </label>
          <select id="city-filter" name="city">
            <option value="">All Cities</option>
          </select>
          <button type="reset" id="reset-city">Reset</button>
        </form>
        <form id="company-form">
          <label for="company-filter">Company: </label>
          <select id="company-filter" name="company" autocomplete="off">
            <option value="">All Companies</option>
            <option value="Sodexo">Sodexo</option>
            <option value="Compass Group">Compass Group</option>
          </select>
          <button type="reset" id="reset-company">Reset</button>
        </form>
        <ul id="restaurant-list"></ul>
      </section>
      <section id="restaurant-details" hidden>
        <header>
          <h2 id="restaurant-name"></h2>
          <button type="button" id="back-button" aria-label="back to list">
            Back to list
          </button>
        </header>
        <p id="restaurant-address"></p>
        <p id="restaurant-city"></p>
        <p id="restaurant-company"></p>
        <fieldset>
          <legend>Menu</legend>
          <label>
            <input type="radio" name="menu-type" value="daily" checked />
            Today
          </label>
          <label>
            <input type="radio" name="menu-type" value="weekly" /> Weekly
          </label>
        </fieldset>
        <div id="restaurant-menu"></div>
      </section>
    </main>
    <footer id="footer">
      <p>
        powered by
        <a href="https://www.metropolia.fi/"
          >Metropolia University of Applied Sciences</a
        >
        Restaurant data: Metropolia Student Restaurants API Jonatan Åberg,
        10/2026>
      </p>
    </footer>
  </body>
</html>
